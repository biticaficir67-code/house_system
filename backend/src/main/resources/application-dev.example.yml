# Copy to application-dev.yml; this local file is excluded by backend/.gitignore.
# Configure DB_URL, DB_USERNAME and DB_PASSWORD in your IDE environment.
# Original empty database: set BOOTSTRAP_KEY temporarily for the first administrator.
# Team baseline: house_system_latest.sql; then run direct_account_sessions.sql if auth_session is missing.
# Login reads sys_admin and broker directly; see TEAM_LOGIN.md.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/house_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

logging:
  level:
    system: info
    org.mybatis: info

management:
  endpoint:
    health:
      show-details: always
