spring:
  jackson:
    time-zone: Asia/Shanghai
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB
  application:
    name: house-system-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/house_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: HouseSystemPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000

mybatis:
  mapper-locations: classpath*:/mapper/*.xml
  type-aliases-package: system
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true
    jdbc-type-for-null: 'NULL'

app:
  security:
    bootstrap-key: ${BOOTSTRAP_KEY:}
    token-hours: ${TOKEN_HOURS:12}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://127.0.0.1:5174}
  upload:
    directory: ${UPLOAD_DIRECTORY:./uploads}
  reminders:
    cron: ${REMINDER_CRON:0 0 9 * * *}
  integrations:
    ai:
      price-base-url: ${AI_PRICE_BASE_URL:http://127.0.0.1:8001}
      text-base-url: ${AI_TEXT_BASE_URL:http://127.0.0.1:5001}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
