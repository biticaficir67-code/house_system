spring:
  datasource:
    url: jdbc:h2:mem:backend_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
  main:
    allow-bean-definition-overriding: true
app:
  security:
    bootstrap-key: integration-test-only
  upload:
    directory: ./target/test-uploads
  reminders:
    cron: 0 0 0 1 1 *
logging:
  level:
    system.ai: ERROR
    system.common.GlobalExceptionHandler: ERROR
